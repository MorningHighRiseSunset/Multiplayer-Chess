<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess Board Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #board {
            margin: 0;
            display: inline-block;
            width: 800px;
            height: 600px;
        }
    </style>
</head>
<body>
    <div id="board"></div>

    <script src="jquery-2.1.3.min.js"></script>
    <script src="chess.js"></script>
    <script src="three.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chessboard3.js"></script>
    <script>
        console.log("Scripts loaded");

        // Check if WebGL is enabled
        if (!ChessBoard3.webGLEnabled()) {
            alert("WebGL is not enabled or supported by your browser.");
        } else {
            console.log("WebGL enabled");

            // Initialize chess game
            var game = new Chess();
            console.log("Chess game initialized");

            // Create the 3D chess board
            var board = new ChessBoard3('board', {
                position: 'start',
                draggable: true,
                pieceSet: 'assets/chesspieces/classic/{piece}.json',
                cameraControls: true,
                rotateControls: true,
                zoomControls: true,
                showErrors: 'console',
                backgroundColor: 0x2c3e50
            });

            console.log("Board created:", board);

            // Force board resize after creation
            setTimeout(function() {
                var boardDiv = document.getElementById('board');
                console.log("Board div width:", boardDiv.style.width);
                console.log("Board div height:", boardDiv.style.height);
                board.resize();
                console.log("Board resized");
            }, 100);
        }
    </script>
</body>
</html>
