<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Chess Pack Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    #container {
      width: 800px;
      height: 600px;
      margin: 20px auto;
      border: 2px solid #333;
      background: #000;
    }
    #status {
      text-align: center;
      margin: 20px;
      padding: 10px;
      background: #222;
      border-radius: 5px;
    }
    #info {
      max-width: 800px;
      margin: 20px auto;
      padding: 15px;
      background: #222;
      border-radius: 5px;
      font-size: 14px;
    }
    .success { color: #4caf50; }
    .error { color: #f44336; }
    .info { color: #2196f3; }
  </style>
</head>
<body>
  <h1 style="text-align: center;">3D Chess Pack Test</h1>
  
  <div id="status">
    <span class="info">Initializing Three.js...</span>
  </div>
  
  <div id="container"></div>
  
  <div id="info">
    <h3>Debug Information:</h3>
    <div id="debug-log"></div>
  </div>
  
  <div id="color-controls" style="max-width: 800px; margin: 20px auto; padding: 15px; background: #222; border-radius: 5px;">
    <h3>Color Controls</h3>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
      <div>
        <label>White Pieces:</label>
        <input type="color" id="white-color" value="#f5deb3" style="margin-left: 10px;">
      </div>
      <div>
        <label>Black Pieces:</label>
        <input type="color" id="black-color" value="#8b4513" style="margin-left: 10px;">
      </div>
      <div>
        <button id="apply-colors" style="padding: 8px 16px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer;">Apply Colors</button>
      </div>
      <div>
        <button id="reset-colors" style="padding: 8px 16px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">Reset Colors</button>
      </div>
    </div>
  </div>

  <!-- Three.js for 3D pieces -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <script>
    let scene, camera, renderer, controls;
    let loadedModels = {};
    let displayedPieces = []; // Store references to displayed pieces
    let originalMaterials = {}; // Store original materials for reset
    const statusDiv = document.getElementById('status');
    const debugLog = document.getElementById('debug-log');
    
    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.className = type;
      logEntry.textContent = `[${timestamp}] ${message}`;
      debugLog.appendChild(logEntry);
      console.log(message);
    }
    
    function updateStatus(message, type = 'info') {
      statusDiv.innerHTML = `<span class="${type}">${message}</span>`;
      log(message, type);
    }
    
    function init() {
      updateStatus('Setting up scene...');
      
      const container = document.getElementById('container');
      
      // Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);
      
      // Camera setup
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 8, 12);
      
      // Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);
      
      // OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      
      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(5, 10, 5);
      directionalLight.castShadow = true;
      scene.add(directionalLight);
      
      // Add a simple ground plane
      const groundGeometry = new THREE.PlaneGeometry(20, 20);
      const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.5;
      ground.receiveShadow = true;
      scene.add(ground);
      
      updateStatus('Loading chess pieces model...');
      loadChessModels();
      
      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
      
      // Handle resize
      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    }
    
    function loadChessModels() {
      const loader = new THREE.GLTFLoader();
      
      // Load individual GLB files from new chess pack
      const pieceFiles = [
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/01_king_light.glb', type: 'k', color: 'white' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/02_king_dark.glb', type: 'k', color: 'black' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/03_queen_light.glb', type: 'q', color: 'white' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/04_queen_dark.glb', type: 'q', color: 'black' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/05_bishop_light.glb', type: 'b', color: 'white' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/06_bishop_dark.glb', type: 'b', color: 'black' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/07_knight_light.glb', type: 'n', color: 'white' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/08_knight_dark.glb', type: 'n', color: 'black' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/09_rook_light.glb', type: 'r', color: 'white' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/10_rook_dark.glb', type: 'r', color: 'black' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/11_pawn_light.glb', type: 'p', color: 'white' },
        { file: '3D_chess_pieces_pack/3D_Chess_Pieces_Pack/models/12_pawn_dark.glb', type: 'p', color: 'black' }
      ];
      
      let loadedCount = 0;
      let failedCount = 0;
      
      pieceFiles.forEach(({ file, type }) => {
        log(`Attempting to load: ${file}`);
        
        loader.load(
          file,
          (gltf) => {
            loadedCount++;
            log(`Successfully loaded: ${file}`, 'success');
            log(`Scene children count: ${gltf.scene.children.length}`);
            
            const loadedScene = gltf.scene;
            let pieceCount = 0;
            
            loadedScene.traverse((child) => {
              if (child.isMesh) {
                pieceCount++;
                const name = child.name.toLowerCase();
                log(`Found mesh in ${file}: ${child.name}`, 'info');
                
                // Clone materials to prevent sharing issues
                child.traverse((node) => {
                  if (node.isMesh && node.material) {
                    node.material = node.material.clone();
                  }
                });
                
                // Store piece (check if specific color is specified)
                const targetColor = pieceFiles.find(p => p.file === file)?.color || 'white';
                const modelKey = `${targetColor}-${type}`;
                if (!loadedModels[modelKey]) {
                  loadedModels[modelKey] = child.clone();
                  log(`Stored ${modelKey}`, 'success');
                }
              }
            });
            
            log(`Total meshes in ${file}: ${pieceCount}`, 'info');
            
            // Check if all files are loaded
            if (loadedCount + failedCount === pieceFiles.length) {
              finalizeLoading();
            }
          },
          (progress) => {
            const percent = (progress.loaded / progress.total * 100).toFixed(1);
            log(`Loading ${file}: ${percent}%`);
          },
          (error) => {
            failedCount++;
            log(`Error loading ${file}: ${error.message}`, 'error');
            
            // Check if all files are loaded
            if (loadedCount + failedCount === pieceFiles.length) {
              finalizeLoading();
            }
          }
        );
      });
    }
    
    function finalizeLoading() {
      // Create black versions by cloning white versions (only for pieces that don't have both colors)
      const whiteTypes = Object.keys(loadedModels).filter(key => key.startsWith('white-'));
      whiteTypes.forEach(whiteKey => {
        const type = whiteKey.split('-')[1];
        const blackKey = `black-${type}`;
        // Only create black version if it doesn't exist and we have a white version
        if (!loadedModels[blackKey] && loadedModels[whiteKey]) {
          loadedModels[blackKey] = loadedModels[whiteKey].clone();
          log(`Created ${blackKey} from ${whiteKey}`, 'success');
        }
      });
      
      log(`Total models loaded: ${Object.keys(loadedModels).length}`, 'info');
      
      if (Object.keys(loadedModels).length > 0) {
        displayLoadedPieces();
      } else {
        updateStatus('No pieces could be loaded', 'error');
      }
    }
    
    function displayLoadedPieces() {
      updateStatus('Displaying loaded pieces...', 'success');
      
      const pieceTypes = ['p', 'r', 'n', 'b', 'q', 'k'];
      const colors = ['white', 'black'];
      let xOffset = -4;
      let zOffset = -2;
      
      colors.forEach((color, colorIdx) => {
        pieceTypes.forEach((type, typeIdx) => {
          const modelKey = `${color}-${type}`;
          if (loadedModels[modelKey]) {
            const piece = loadedModels[modelKey].clone();
            piece.scale.setScalar(0.8);
            piece.position.set(xOffset + typeIdx * 1.5, 0, zOffset + colorIdx * 3);
            
            if (color === 'black') {
              piece.rotation.y = Math.PI;
            }
            
            piece.castShadow = true;
            piece.receiveShadow = true;
            scene.add(piece);
            
            // Store reference and original materials
            displayedPieces.push({ mesh: piece, color: color, type: type });
            
            // Store original materials for each mesh
            piece.traverse((child) => {
              if (child.isMesh && child.material) {
                const meshId = `${color}-${type}-${child.uuid}`;
                originalMaterials[meshId] = child.material.clone();
              }
            });
            
            log(`Displayed ${color} ${type}`, 'success');
          } else {
            log(`Missing ${color} ${type}`, 'error');
          }
        });
      });
      
      updateStatus(`Loaded ${Object.keys(loadedModels).length} pieces successfully!`, 'success');
      
      // Setup color controls
      setupColorControls();
    }
    
    function setupColorControls() {
      const applyBtn = document.getElementById('apply-colors');
      const resetBtn = document.getElementById('reset-colors');
      const whiteColorPicker = document.getElementById('white-color');
      const blackColorPicker = document.getElementById('black-color');
      
      applyBtn.addEventListener('click', () => {
        const whiteColor = new THREE.Color(whiteColorPicker.value);
        const blackColor = new THREE.Color(blackColorPicker.value);
        
        displayedPieces.forEach(({ mesh, color }) => {
          const targetColor = color === 'white' ? whiteColor : blackColor;
          applyColorToMesh(mesh, targetColor);
        });
        
        log(`Applied colors - White: ${whiteColorPicker.value}, Black: ${blackColorPicker.value}`, 'success');
      });
      
      resetBtn.addEventListener('click', () => {
        displayedPieces.forEach(({ mesh, color, type }) => {
          mesh.traverse((child) => {
            if (child.isMesh && child.material) {
              const meshId = `${color}-${type}-${child.uuid}`;
              if (originalMaterials[meshId]) {
                child.material = originalMaterials[meshId].clone();
              }
            }
          });
        });
        
        log('Reset colors to original', 'info');
      });
    }
    
    function applyColorToMesh(mesh, color) {
      mesh.traverse((child) => {
        if (child.isMesh && child.material) {
          // Handle different material types
          if (child.material.isMeshStandardMaterial || child.material.isMeshPhongMaterial) {
            child.material.color = color.clone();
            // Also affect emissive if it exists
            if (child.material.emissive) {
              child.material.emissive = color.clone();
              child.material.emissiveIntensity = 0.1;
            }
          } else if (child.material.isMeshBasicMaterial) {
            child.material.color = color.clone();
          }
          // For multi-material objects, handle array of materials
          if (Array.isArray(child.material)) {
            child.material.forEach(mat => {
              if (mat.isMeshStandardMaterial || mat.isMeshPhongMaterial) {
                mat.color = color.clone();
              } else if (mat.isMeshBasicMaterial) {
                mat.color = color.clone();
              }
            });
          }
        }
      });
    }
    
    // Initialize when page loads
    window.addEventListener('load', init);
  </script>
</body>
</html>
